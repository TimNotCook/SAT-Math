<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>讲义 · 线性方程与函数</title>
<style>
  :root{
    --bar-bg:rgba(247,246,242,.94); --paper:#f7f6f2; --ink:#20242b; --ink2:#4a4f57; --sub:#8d9199; --faint:#a8acb4;
    --line:#e7e3da; --line-soft:#efece4; --sand:#f4eddf; --sand-ink:#4a4237;
    --sand-k:#a08a5e; --sand-rule:#c9b48a; --card:#ffffff; --blue:#2563eb;
  }
  html.theme-dark{
    --paper:#121214; --ink:#e9e9ec; --ink2:#b9b9c1; --sub:#8c8c95; --faint:#6d6d76;
    --line:#2a2a2f; --line-soft:#232327; --sand:#211c14; --sand-ink:#cfc2a8;
    --sand-k:#b09468; --sand-rule:#8d7a55; --card:#18181b; --blue:#3b76f0; --bar-bg:rgba(18,18,20,.92);
  }
  @media (prefers-color-scheme:dark){
    html:not(.theme-light){
      --paper:#121214; --ink:#e9e9ec; --ink2:#b9b9c1; --sub:#8c8c95; --faint:#6d6d76;
      --line:#2a2a2f; --line-soft:#232327; --sand:#211c14; --sand-ink:#cfc2a8;
      --sand-k:#b09468; --sand-rule:#8d7a55; --card:#18181b; --blue:#3b76f0; --bar-bg:rgba(18,18,20,.92);
    }
    html:not(.theme-light) .diagram [stroke="#e2ded4"]{stroke:var(--line)}
    html:not(.theme-light) .diagram [stroke="#efece4"]{stroke:var(--line-soft)}
    html:not(.theme-light) .diagram [stroke="#20242b"]{stroke:var(--ink)}
    html:not(.theme-light) .diagram [fill="#20242b"]{fill:var(--ink)}
    html:not(.theme-light) .diagram [fill="#a8acb4"]{fill:var(--faint)}
    html:not(.theme-light) .diagram [fill="#a8925f"]{fill:var(--sand-k)}
  }
  *{box-sizing:border-box}
  html{background:var(--paper);color-scheme:light dark}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.75}
  .bar{position:sticky;top:0;z-index:5;background:var(--bar-bg);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .bar-in{max-width:760px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between}
  .bar-k{font-size:11px;letter-spacing:.16em;color:var(--faint);font-weight:600}
  .bar-a{font-size:12.5px;color:var(--sub);text-decoration:none}
  .bar-a:hover{color:var(--ink)}
  .wrap{max-width:720px;margin:0 auto;padding:52px 24px 96px}

  .kicker{font-size:11px;letter-spacing:.16em;color:var(--faint);font-weight:600;margin:0 0 14px}
  h1{font-size:34px;line-height:1.28;letter-spacing:-.015em;font-weight:650;margin:0 0 14px}
  .lead{font-size:16px;color:var(--ink2);margin:0 0 22px;max-width:34em;text-wrap:pretty}
  .meta{display:flex;gap:28px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:0 0 18px}
  .meta div{font-size:11.5px;color:var(--sub)}
  .meta b{display:block;font-size:19px;font-weight:600;color:var(--ink);line-height:1.4;font-variant-numeric:tabular-nums}
  .toc{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 40px}
  .toc a{font-size:11.5px;color:var(--sub);text-decoration:none;padding:4px 9px;border:1px solid transparent;border-radius:2px;font-variant-numeric:tabular-nums}
  .toc a:hover{background:var(--line-soft);color:var(--ink)}
  .toc a.rd{color:var(--ink)}
  .toc a.rd:after{content:"✓";font-size:9.5px;color:var(--sand-k);margin-left:3px;vertical-align:.08em}
  .toc-p{margin-left:auto;font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.04em;align-self:center}
  .toc a.on{border-color:var(--line);background:var(--sand);color:var(--ink);font-weight:600}

  section{margin:0 0 42px}
  .h{display:flex;gap:14px;align-items:baseline;margin:0 0 16px}
  .num{font-size:11px;letter-spacing:.14em;color:var(--faint);font-weight:600;min-width:22px}
  h2{font-size:20px;font-weight:650;letter-spacing:-.01em;margin:0}
  p{margin:0 0 14px;font-size:15px;color:var(--ink2);max-width:38em;text-wrap:pretty}
  p strong,b{color:var(--ink);font-weight:600}
  ul{margin:0 0 14px;padding:0;list-style:none}
  ul li{position:relative;padding-left:20px;margin:0 0 10px;font-size:15px;color:var(--ink2);max-width:38em}
  ul li:before{content:"";position:absolute;left:2px;top:.72em;width:5px;height:1px;background:var(--faint);opacity:.55}
  .warn li:before{background:var(--sand-rule);width:6px}
  .check{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:18px 20px}
  .check li{padding-left:22px;cursor:pointer;transition:color .18s}
  .check li:hover{color:var(--ink)}
  .check li:before{content:"□";left:0;top:0;width:auto;height:auto;background:none;color:var(--faint);font-size:14px}
  .check li.on{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sand-rule)}
  .check li.on:before{content:"☑";color:var(--sand-k)}
  .eq{font-family:"SF Pro Display","Helvetica Neue",Georgia,serif;font-size:19px;color:var(--ink);padding:2px 0;margin:0 0 14px;letter-spacing:.01em}
  .diagram{border:1px solid var(--line);background:var(--card);border-radius:2px;padding:18px 10px 8px;margin:0 0 10px}
  .diagram svg{display:block;width:100%;height:auto}
  /* 讲义矢量图用的是固定六色，深色下按角色换成当前纸面的墨色，否则线会黑进纸里看不见 */
  html.theme-dark .diagram [stroke="#e2ded4"]{stroke:var(--line)}
  html.theme-dark .diagram [stroke="#efece4"]{stroke:var(--line-soft)}
  html.theme-dark .diagram [stroke="#20242b"]{stroke:var(--ink)}
  html.theme-dark .diagram [fill="#20242b"]{fill:var(--ink)}
  html.theme-dark .diagram [fill="#a8acb4"]{fill:var(--faint)}
  html.theme-dark .diagram [fill="#a8925f"]{fill:var(--sand-k)}
  .cap{font-size:11.5px;color:var(--sub);margin:0 0 20px}
  .eg{background:var(--sand);border-radius:2px;padding:18px 20px;margin:0 0 16px}
  .eg-k{font-size:10.5px;letter-spacing:.14em;color:var(--sand-k);font-weight:600;margin:0 0 8px}
  .eg p{margin:0 0 8px;color:var(--sand-ink);font-size:14.5px}
  .eg p.step{padding-left:18px;position:relative}
  .eg p.step:before{content:"";position:absolute;left:0;top:.72em;width:5px;height:1px;background:var(--sand-rule)}

  .go{border-top:1px solid var(--line);padding-top:26px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
  .go-l{display:flex;gap:18px;font-size:12.5px}
  .go-l a{color:var(--sub);text-decoration:none}
  .go-l a:hover{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;height:42px;padding:0 22px;border-radius:8px;background:var(--blue);color:#fff;font-size:13.5px;font-weight:600;text-decoration:none;border:1px solid var(--blue)}
  .btn:hover{filter:brightness(1.05)}
  .empty{font-size:14px;color:var(--sub)}

  @media (max-width:560px){
    .wrap{padding:34px 20px 72px}
    h1{font-size:27px}
    .meta{gap:20px}
    .meta b{font-size:16px}
    .eg{padding:16px}
    .go{flex-direction:column;align-items:flex-start}
  }
</style>
<script>try{var t=localStorage.getItem("tdsat_theme");if(t&&/dark/i.test(t)){document.documentElement.classList.add("theme-dark")}else if(t){document.documentElement.classList.add("theme-light")}}catch(e){}</script>
</head>
<body>
<div class="bar"><div class="bar-in">
  <span class="bar-k" id="barK">SAT MATH · 讲义</span>
  <a class="bar-a" href="jiangyi.html">← 回到讲义</a>
</div></div>
<div class="wrap">
  <p class="kicker" id="kick"></p>
  <h1 id="ttl"></h1>
  <p class="lead" id="lead"></p>
  <div class="meta" id="meta"></div>
  <div class="toc" id="toc"></div>
  <div id="body"></div>
  <div class="go">
    <div class="go-l" id="goL"></div>
    <a class="btn" id="goBtn" href="jiangyi.html">回到讲义做题</a>
  </div>
</div>
<script src="data/lessons-a.js"></script>
<script src="data/lessons-b.js"></script>
<script src="data/lessons-c.js"></script>
<script>
(function () {
  var S = Object.assign({}, window.LESSONS_A || {}, window.LESSONS_B || {}, window.LESSONS_C || {});
  var q = new URLSearchParams(location.search);
  var allKeys = Object.keys(S).sort();
  var sec = q.get('sec') || allKeys[0] || '';
  if (!S[sec]) sec = allKeys[0] || '';
  var unit = sec.split('.')[0];
  var keys = allKeys.filter(function (k) { return k.split('.')[0] === unit; });
  if (!keys.length) keys = allKeys;
  var nextUnit = allKeys.filter(function (k) { return k.split('.')[0] === String((+unit) + 1); })[0] || '';
  var prevUnit = allKeys.filter(function (k) { return k.split('.')[0] === String((+unit) - 1); });

  function md(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  }
  function block(b) {
    if (b.t === 'h') return '<div class="h"><span class="num">' + b.n + '</span><h2>' + md(b.v) + '</h2></div>';
    if (b.t === 'p') return '<p>' + md(b.v) + '</p>';
    if (b.t === 'eq') return '<p class="eq">' + md(b.v) + '</p>';
    if (b.t === 'cap') return '<p class="cap">' + md(b.v) + '</p>';
    if (b.t === 'svg') return '<div class="diagram">' + b.v + '</div>';
    if (b.t === 'ul') return '<ul class="' + (b.cls || '') + '">' + b.v.map(function (i, n) { return '<li' + (b.cls === 'check' ? ' data-i="' + n + '"' : '') + '>' + md(i) + '</li>'; }).join('') + '</ul>';
    if (b.t === 'eg') {
      var head = b.k ? '<p class="eg-k">' + md(b.k) + '</p>' : '';
      return '<div class="eg">' + head + b.v.map(function (i) { return '<p class="step">' + md(i) + '</p>'; }).join('') + '</div>';
    }
    return '';
  }

  if (!sec || !S[sec]) {
    document.getElementById('ttl').textContent = '这一节还没有正文';
    document.getElementById('body').innerHTML = '<p class="empty">讲义正文正在补写，先去做这一节的题。</p>';
    return;
  }

  var L = S[sec], idx = keys.indexOf(sec);
  document.title = '讲义 ' + sec + ' · ' + L.cn;
  document.getElementById('barK').textContent = 'SAT MATH · 讲义 ' + sec;
  document.getElementById('kick').textContent = L.kicker || '';
  document.getElementById('ttl').textContent = L.cn;
  document.getElementById('lead').textContent = L.lead || '';
  document.getElementById('meta').innerHTML = (L.meta || []).map(function (m) {
    return '<div><b>' + m[0] + '</b>' + m[1] + '</div>';
  }).join('');
  document.getElementById('toc').innerHTML = keys.map(function (k) {
    return '<a href="lesson.html?sec=' + k + '"' + (k === sec ? ' class="on"' : '') + '>' + k + '</a>';
  }).join('');

  var groups = [], cur = null;
  (L.blocks || []).forEach(function (b) {
    if (b.t === 'h') { cur = [b]; groups.push(cur); }
    else if (cur) cur.push(b);
    else { cur = [b]; groups.push(cur); }
  });
  document.getElementById('body').innerHTML = groups.map(function (g) {
    return g[0].t === 'h' ? '<section>' + g.map(block).join('') + '</section>' : g.map(block).join('');
  }).join('');

  var prev = keys[idx - 1], next = keys[idx + 1], links = [];
  if (prev) links.push('<a href="lesson.html?sec=' + prev + '">← ' + prev + '</a>');
  else if (prevUnit.length) links.push('<a href="lesson.html?sec=' + prevUnit[prevUnit.length - 1] + '">← 上一单元 ' + prevUnit[prevUnit.length - 1] + '</a>');
  if (next) links.push('<a href="lesson.html?sec=' + next + '">' + next + ' →</a>');
  else if (nextUnit) links.push('<a href="lesson.html?sec=' + nextUnit + '">下一单元 ' + nextUnit + ' →</a>');
  document.getElementById('goL').innerHTML = links.join('');
  document.getElementById('goBtn').textContent = '去做 ' + sec + ' 的题';

  // —— 一分钟检查：点一下划掉，本节单独记 ——
  var CKEY = 'lesson_check_v1:' + sec, cm = {};
  try { cm = JSON.parse(localStorage.getItem(CKEY) || '{}'); } catch (e) {}
  [].forEach.call(document.querySelectorAll('.check li'), function (li) {
    var k = li.getAttribute('data-i');
    if (cm[k]) li.classList.add('on');
    li.addEventListener('click', function () {
      if (cm[k]) { delete cm[k]; li.classList.remove('on'); }
      else { cm[k] = 1; li.classList.add('on'); }
      try { localStorage.setItem(CKEY, JSON.stringify(cm)); } catch (e) {}
    });
  });

  // —— 下次打开回到上次停下的位置 ——
  var PKEY = 'lesson_pos_v1';
  function pMap() { try { return JSON.parse(localStorage.getItem(PKEY) || '{}'); } catch (e) { return {}; } }
  var holding = false, tick = 0;
  (function () {
    var r = pMap()[sec];
    if (typeof r === 'number' && r > 0.03 && r < 0.95) {
      holding = true;
      requestAnimationFrame(function () {
        window.scrollTo(0, r * Math.max(0, document.body.scrollHeight - window.innerHeight));
        setTimeout(function () { holding = false; }, 150);
      });
    }
  })();
  window.addEventListener('scroll', function () {
    if (holding) return;
    clearTimeout(tick);
    tick = setTimeout(function () {
      var h = Math.max(1, document.body.scrollHeight - window.innerHeight);
      var m = pMap(); m[sec] = Math.min(1, (window.scrollY || 0) / h);
      try { localStorage.setItem(PKEY, JSON.stringify(m)); } catch (e) {}
    }, 260);
  }, { passive: true });
  // —— 阅读进度：只在本地记一笔，用来在目录上打勾 ——
  var KEY = 'lesson_read_v1';
  function readMap() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  function paintToc() {
    var m = readMap(), n = 0;
    [].forEach.call(document.querySelectorAll('#toc a'), function (a) {
      var k = a.getAttribute('href').split('=')[1];
      var uk = k.split('.')[0];
      if (m[k] && uk === unit) { a.classList.add('rd'); n++; }
    });
    var cnt = document.getElementById('tocCount');
    if (!cnt) {
      cnt = document.createElement('span');
      cnt.id = 'tocCount'; cnt.className = 'toc-p';
      document.getElementById('toc').appendChild(cnt);
    }
    cnt.textContent = '已读 ' + n + ' / ' + keys.length;
  }
  paintToc();
  function markRead() {
    var m = readMap();
    if (!m[sec]) { m[sec] = 1; try { localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) {} paintToc(); }
  }
  var secs = document.querySelectorAll('#body section');
  if (secs.length && 'IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (es) {
      for (var i = 0; i < es.length; i++) { if (es[i].isIntersecting) { markRead(); io.disconnect(); break; } }
    }, { rootMargin: '0px 0px -25% 0px' });
    io.observe(secs[secs.length - 1]);
  }
  document.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey || e.shiftKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '')) return;
    if (e.key === 'ArrowRight' && next) location.href = 'lesson.html?sec=' + next;
    if (e.key === 'ArrowLeft' && prev) location.href = 'lesson.html?sec=' + prev;
  });
})();
</script>
</body>
</html>
