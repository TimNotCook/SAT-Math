<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="SAT Math 真题练习：单元练习与专项训练，按单元与板块刷题，内置参考公式表、题目导航，做题进度保存在本机。">
  <meta name="theme-color" content="#2563eb">
  <!-- CSP：静态站无响应头通道，用 meta 兜底。白名单仅含实际用到的源；'unsafe-inline' 供页面内联 script/style（index 重定向/wrong 渲染等）；tesseract 的 WASM 与 worker 内 new Function 在 worker 线程执行，不受页面 script-src 约束，故无需 'unsafe-eval'。 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: https://*.supabase.co https://*.supabase.in https://wbapp-ppcowwierzgpcol1drmipc.app.workbuddy.host https://www.workbuddy.cn; worker-src 'self' blob: https://cdn.jsdelivr.net https://unpkg.com; frame-src 'self' https://www.desmos.com; object-src 'none'; base-uri 'self'; form-action 'self'; manifest-src 'self'">
  <title>SAT Math Prep · 真题练习</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 10h14v3.2h-5.4V24h-3.2V13.2H9z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css?v=e4c4b8fcce0a">
  <link rel="stylesheet" href="bluebook.css?v=e4c4b8fcce0a">
  <link rel="stylesheet" href="glass.css?v=e4c4b8fcce0a"><script src="theme.js?v=e4c4b8fcce0a"></script><script src="i18n.js?v=e4c4b8fcce0a"></script>
  <style>#questionNav{z-index:68!important}</style>
</head>
<body class="drill-page site-shell shell-drill">
  <aside class="site-rail" aria-label="全站导航">
  <a class="rail-brand" href="drill.html">SAT Math Prep</a>
  <a href="drill.html" aria-current="page">真题练习</a>
  <a href="exam.html?mode=quiz&unit=1">单元抽查</a>
  <a href="wrong.html">错题回顾</a>
  <a href="exam.html?mode=mock">模考</a>
  <a href="history.html">模考记录</a>
  <div class="rail-sep"></div>
</aside>
  <div id="appnav"></div>

  <!-- Section result: only revealed after the learner finishes a section.
       No correctness is disclosed anywhere during answering. -->
  <main class="drill-result" id="resultView" hidden>
    <div class="drill-result-inner">
      <h1 id="resultTitle">板块结果</h1>
      <p class="drill-select-lead" id="resultLead"></p>

      <section class="drill-result-summary" aria-label="本板块成绩">
        <div class="drill-result-score">
          <span class="drill-result-score-label">正确率</span>
          <strong id="resultAccuracy">0%</strong>
          <span class="drill-result-score-sub" id="resultFraction"></span>
        </div>
        <dl class="drill-result-tallies">
          <div><dt>答对</dt><dd id="resultRight">0</dd></div>
          <div><dt>答错</dt><dd id="resultWrong">0</dd></div>
          <div><dt>未答</dt><dd id="resultBlank">0</dd></div>
          <div><dt>总题数</dt><dd id="resultTotal">0</dd></div>
        </dl>
      </section>

      <div class="drill-result-notice" id="resultNotice" hidden>
        <span id="resultNoticeText"></span>
        <a class="drill-result-notice-link" href="wrong.html">查看错题回顾</a>
      </div>

      <h2 class="drill-select-h">逐题结果</h2>
      <div class="drill-result-list" id="resultList"></div>

      <div class="drill-result-actions">
        <a class="btn primary" href="drill.html">返回板块列表</a>
        <a class="btn" id="resultPracticeLink" href="#">继续练习本板块</a>
        <a class="btn" href="wrong.html">查看错题回顾</a>
      </div>
    </div>
  </main>

  <!-- 题库解析完之前先给一句占位，避免慢网/老机器上整页空白。showView 首次调用时移除。 -->
  <div id="drillLoading" style="max-width:640px;margin:64px auto 0;text-align:center;font:14px/1.8 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#6b7280">正在载入题库…</div>

  <!-- First screen: 真题练习 landing with two boards (单元练习 / 专项训练). -->
  <main class="drill-select" id="selectView" hidden>
    <div class="drill-select-inner">
      <div class="hero-tiles">
        <div class="hero-main">
          <h1>真题练习</h1>
        </div>
        <span class="hero-deco" aria-hidden="true">
          <svg width="128" height="72" viewBox="0 0 128 72" fill="none">
            <circle cx="34" cy="36" r="21" stroke="#c2d4ea" stroke-width="1.2"/>
            <circle cx="64" cy="36" r="13" stroke="#c2d4ea" stroke-width="1.2"/>
            <circle cx="92" cy="22" r="3" fill="#c2d4ea"/>
            <circle cx="102" cy="44" r="2" fill="#c2d4ea"/>
            <circle cx="84" cy="54" r="1.5" fill="#c2d4ea"/>
          </svg>
        </span>
      </div>
      <div id="resumeSlot"></div>
      <div class="entry-tile-grid" id="boardNav"></div>
      <div class="tile-grid" id="boardPanel"></div>
    </div>
  </main>

  <!-- 单元练习: textbook regular sections (no Topic), grouped by unit. -->
  <main class="drill-select" id="unitView" hidden>
    <div class="drill-select-inner">
      <div class="drill-crumb"><a href="drill.html">真题练习</a><span>›</span><b>单元练习</b></div>
      <h1>单元练习</h1>
      <h2 class="drill-select-h">单元</h2>
      <div class="drill-unit-row" id="unitPicker"></div>
      <h2 class="drill-select-h">板块</h2>
      <div class="tile-grid" id="sectionList"></div>
    </div>
  </main>

  <!-- 专项训练: Topic sections (1.7.T*, 3.6.T*), grouped by unit. -->
  <main class="drill-select" id="specialView" hidden>
    <div class="drill-select-inner">
      <div class="drill-crumb"><a href="drill.html">真题练习</a><span>›</span><b>专项训练</b></div>
      <h1>专项训练</h1>
      <h2 class="drill-select-h">单元</h2>
      <div class="drill-unit-row" id="specialUnitPicker"></div>
      <h2 class="drill-select-h">专项板块</h2>
      <div class="tile-grid" id="specialList"></div>
      <div id="specialResumeSlot"></div>
    </div>
  </main>

  <div id="questionView" hidden>
    <header class="drill-context">
      <div class="drill-context-inner">
        <div class="drill-context-left">
          <span class="drill-context-section" id="currentSection"></span>
        </div>
        <div class="drill-context-right">
          <a class="drill-context-link" href="drill.html">选择板块</a>
          <span class="drill-save-status" id="saveStatus" role="status" aria-live="polite">作答自动保存</span>
        </div>
      </div>
    </header>

    <section class="drill-questionbar" aria-label="题目工具">
      <div class="drill-questionbar-inner">
        <div class="drill-questionbar-left">
          <span class="drill-qnumber" id="qNumber">1</span>
          <button class="drill-mark-button" id="btnMark" type="button" aria-pressed="false">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m19 21-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            <span id="markLabel">标记</span>
          </button>
        </div>
        <div class="drill-question-tools">
          <button type="button" id="btnScratch" title="草稿板：在题目上涂画标记、写草稿，答案可直接填写">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            <span>Scratch</span>
          </button>
          <button type="button" id="btnReference">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></svg>
            <span>Reference</span>
          </button>
          <button type="button" id="btnCalculator" class="exam-tool-link" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="18"/></svg>
            <span>Calculator</span>
          </button>
        </div>
      </div>
    </section>

    <main class="drill-main">
      <article class="drill-question" id="question" tabindex="-1" aria-labelledby="qStem">
        <div class="drill-stem" id="qStem"></div>
        <div id="answerArea"></div>
      </article>
    </main>

    <footer class="drill-footer">
      <div class="drill-footer-inner">
        <div class="drill-footer-section" id="footerSection"></div>
        <button class="drill-position-button" id="btnQuestionNav" type="button" aria-haspopup="dialog" aria-controls="questionNav">
          <span id="questionPosition">第 1 / 1 题</span>
        </button>
        <div class="drill-footer-actions">
          <button class="drill-page-button" id="btnPrevious" type="button" aria-label="上一题">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            <span class="drill-nav-label">上一题</span>
          </button>
          <button class="drill-page-button drill-next-button" id="btnNext" type="button" aria-label="下一题">
            <span class="drill-nav-label">下一题</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
      </div>
    </footer>
  </div>

  <div class="drill-nav-layer" id="questionNav" hidden>
    <div class="drill-nav-backdrop" data-nav-close></div>
    <section class="drill-nav-panel" role="dialog" aria-modal="true" aria-labelledby="questionNavTitle">
      <header class="drill-nav-header">
        <h2 id="questionNavTitle">题目导航</h2>
        <button class="drill-nav-close" type="button" data-nav-close aria-label="关闭题号弹层">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </header>
      <div class="drill-nav-legend" aria-label="题号状态说明">
        <span><i class="is-answered"></i>已答</span><span><i></i>未答</span>
        <span><i class="is-marked"></i>已标记</span><span><i class="is-current"></i>当前</span>
      </div>
      <div class="drill-question-grid" id="questionGrid"></div>
      <div class="drill-nav-footer">
        <button type="button" class="drill-nav-finish" id="btnFinish">完成本板块并查看结果</button>
      </div>
    </section>
  </div>

  <noscript><p class="drill-noscript">请启用 JavaScript 以加载题目并保存作答。</p></noscript>

  <script src="grade-core.js?v=e4c4b8fcce0a" defer></script>
  <script src="app-core.js?v=e4c4b8fcce0a" defer></script>
  <script src="app-ui.js?v=e4c4b8fcce0a" defer></script>
  <script src="progress-save.js?v=e4c4b8fcce0a" defer></script>

  <script src="scratch-pad.js?v=e4c4b8fcce0a" defer></script>
  <script src="analysis.js?v=e4c4b8fcce0a" defer></script>
  <script src="drill.js?v=e4c4b8fcce0a" defer></script>
  <script src="bluebook-shell.js?v=e4c4b8fcce0a" defer></script>
  <script src="cloud-config.js?v=e4c4b8fcce0a" defer></script><script src="supa-cloud.js?v=e4c4b8fcce0a" defer></script>
  <script src="cloud-account.js?v=e4c4b8fcce0a" defer></script>
</body>
</html>
