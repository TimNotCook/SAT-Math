<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="讲义复习：按原书小节顺序练习讲义题目，题卡标注 讲义 p{页} #{页内题号}，与真题板块完全分开。">
  <meta name="theme-color" content="#2563eb">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob: https://*.supabase.co https://*.supabase.in; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>SAT Math Prep · 讲义复习</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 10h14v3.2h-5.4V24h-3.2V13.2H9z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="app.css?v=8e525b34f8bc">
  <link rel="stylesheet" href="bluebook.css?v=8e525b34f8bc">
  <link rel="stylesheet" href="glass.css?v=8e525b34f8bc">
  <script src="theme.js?v=8e525b34f8bc"></script><script src="i18n.js?v=8e525b34f8bc"></script>
  <style>
    .jy-position{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums}
    .jy-table{border-collapse:collapse;margin:14px 0;font-size:14px;font-variant-numeric:tabular-nums}
    .jy-table th,.jy-table td{border:1px solid var(--line);padding:6px 14px;text-align:center}
    .jy-table th{background:#f7faff;font-weight:700;color:var(--navy)}
    .drill-choice-text.drill-choice-table{display:block}
    .drill-choice .jy-table{font-size:inherit}
    .jy-grid{display:flex;gap:10px;align-items:center;max-width:320px}
    .jy-grid input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font:inherit}
    /* 双空 grid-in（官方两空题）：两个独立输入框，各带“第一空/第二空”标签 */
    .jy-grid-multi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 10px;align-items:center;max-width:420px}
    .jy-grid-multi .jy-grid-label{font-size:13px;font-weight:700;color:var(--sub);white-space:nowrap;text-align:right}
    .jy-grid-multi input{width:100%;box-sizing:border-box}
    .jy-grid-multi #jyGridSet{grid-column:1/-1;justify-self:start}
    .jy-book-chip{display:block;width:max-content;max-width:100%;margin:0 0 12px;padding:3px 9px;border:1px solid var(--blue-line,#c7d9f7);border-radius:99px;background:#f3f7ff;color:#1d4ed8;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.01em}
    .jy-empty{padding:28px;border:1px dashed var(--line);border-radius:var(--radius);color:var(--sub);text-align:center}
    .jy-result-row{display:flex;gap:10px;align-items:baseline;padding:10px 0;border-bottom:1px solid var(--line-soft)}
    .jy-result-row .s{font-size:12.5px;color:var(--sub);font-variant-numeric:tabular-nums;min-width:120px}
  </style>
</head>
<body class="drill-page jy-page site-shell">
  <aside class="site-rail" aria-label="全站导航">
  <a class="rail-brand" href="drill.html">SAT Math Prep</a>
  <a href="drill.html">真题练习</a>
  <a href="exam.html?mode=quiz&unit=1">单元抽查</a>
  <a href="wrong.html">错题回顾</a>
  <a href="exam.html?mode=mock">模考</a>
  <a href="history.html">模考记录</a>
  <div class="rail-sep"></div>
  <a class="rail-back" href="drill.html">← 返回真题练习</a>
</aside>

  <!-- 1) 四个子板块 -->
  <main class="drill-select" id="jyBoards">
    <div class="drill-select-inner">
      <h1>讲义复习</h1>
      <!-- 冷启动占位：数据脚本未就绪前先给一句话，避免整页空白（renderBoards 会整段覆盖） -->
      <div class="entry-tile-grid" id="jyBoardCards"><p class="jy-empty" id="jyLoading">正在载入讲义题目…</p></div>
      <p class="jy-empty" id="jyDataNotice" hidden>讲义题目正在补充，稍后再来。</p>
    </div>
  </main>

  <!-- 2) 小节列表 -->
  <main class="drill-select" id="jySections" hidden>
    <div class="drill-select-inner">
      <nav class="drill-crumb" id="jyCrumb">讲义复习</nav>
      <h1 id="jyBoardTitle">代数 · Unit 1</h1>
      <p class="drill-select-lead" id="jyBoardLead" hidden></p>
      <div id="jyGroupList" hidden></div>
      <div class="tile-grid" id="jySectionList"></div>
      <p style="margin-top:16px"><a class="btn" href="jiangyi.html">返回四个子板块</a></p>
    </div>
  </main>

  <!-- 3) 做题 -->
  <div id="jyQuiz" hidden>
    <header class="drill-context">
      <div class="drill-context-inner">
        <div class="drill-context-left"><span class="drill-context-section" id="jyCurrent"></span></div>
        <div class="drill-context-right">
          <a class="drill-context-link" href="#" id="jyBackList">选择小节</a>
          <span class="drill-save-status">作答自动保存</span>
        </div>
      </div>
    </header>
    <section class="drill-questionbar" aria-label="题目信息">
      <div class="drill-questionbar-inner">
        <div class="drill-questionbar-left">
          <span class="drill-qnumber" id="jyNumber">1</span>
        </div>
        <div class="drill-question-tools"><span class="jy-position" id="jyPosition"></span></div>
      </div>
    </section>
    <main class="drill-main">
      <article class="drill-question" id="jyQuestion" tabindex="-1">
        <div class="drill-stem" id="jyStem"></div>
        <div class="td-figure" id="jyFigure" hidden></div>
        <div id="jyAnswerArea"></div>
      </article>
    </main>
    <footer class="drill-footer">
      <div class="drill-footer-inner">
        <span class="drill-footer-section" id="jyFooterSection"></span>
        <div class="drill-footer-actions">
          <button class="btn" type="button" id="jyPrev" aria-label="上一题">上一题</button>
          <button class="btn primary" type="button" id="jyNext" aria-label="下一题">下一题</button>
          <button class="btn" type="button" id="jySubmit">交本节</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- 4) 结果 -->
  <main class="drill-result" id="jyResult" hidden>
    <div class="drill-result-inner">
      <h1 id="jyResultTitle">本节结果</h1>
      <section class="drill-result-summary" aria-label="本节成绩">
        <div class="drill-result-score">
          <span class="drill-result-score-label">正确率</span>
          <strong id="jyResultAccuracy">0%</strong>
          <span class="drill-result-score-sub" id="jyResultFraction"></span>
        </div>
      </section>
      <div id="jyResultWrong"></div>
      <p class="drill-result-actions" style="margin-top:18px">
        <a class="btn primary" href="#" id="jyResultBack">回到小节列表</a>
        <a class="btn" href="jiangyi.html">四个子板块</a>
      </p>
    </div>
  </main>

  <div id="toast" role="status" aria-live="polite"></div>
  <!-- 讲义页与真题题库隔离：不加载 data/questions.js（560K），只给 app-core 一个空题库，
       这样导航栏仍由 app-core 单一来源渲染，讲义进度也不会碰到教材 CATALOG。 -->
  <script>window.TD_BANK = window.TD_BANK || { units: [], questions: [] };</script>
  <script src="grade-core.js?v=8e525b34f8bc" defer></script>
  <script src="app-core.js?v=8e525b34f8bc" defer></script>
  <script src="data/jiangyi.js?v=8e525b34f8bc" defer></script>
  <script src="data/jiangyi_figures.js?v=8e525b34f8bc" defer></script>
  <script src="choice-figures.js?v=8e525b34f8bc" defer></script>
  <script src="jiangyi-core.js?v=8e525b34f8bc" defer></script>
  <script src="jiangyi-page.js?v=8e525b34f8bc" defer></script>
  <!-- 账户面板：与 drill.html 同一套 Supabase 通道（配置 → 会话 → 面板），顺序不可乱。 -->
  <script src="cloud-config.js?v=8e525b34f8bc" defer></script><script src="supa-cloud.js?v=8e525b34f8bc" defer></script>
  <script src="cloud-account.js?v=8e525b34f8bc" defer></script>
</body>
</html>
