name: oneoff-caret-fix
# 一次性补丁：fmtMath 支持裸 "^" 指数（修 18 道题把上标印成 "^2" 的显示错误）+ TD-31-25 题干改 π。
# 跑完测试与自检后提交，并把本 workflow 与补丁脚本一并删掉。
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/oneoff-caret-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oneoff-caret-fix
jobs:
  fix:
    if: github.repository == 'TimNotCook/SAT-Math'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 打补丁
        run: python3 tools/oneoff_caret_fix.py
      - name: 重算资源版本
        run: python3 bump_assets.py .
      - name: 自动测试
        run: node --test test/*.test.js
      - name: 静态自检
        run: node tools/verify_assets.mjs
      - name: 提交并自删
        run: |
          set -e
          git config user.name 'satmath-bot'
          git config user.email 'satmath-bot@users.noreply.github.com'
          git rm -q -f .github/workflows/oneoff-caret-fix.yml tools/oneoff_caret_fix.py
          git add -A
          if [ -z "$(git status --porcelain)" ]; then echo 'nothing to commit'; exit 0; fi
          git commit -q -m 'fix(math): 裸 “^” 指数渲染成上标（18 道题的 x^2 / 2^x / ^(t-12) 与书一致）；TD-31-25 题干 pi 改 π'
          git push origin HEAD:main
