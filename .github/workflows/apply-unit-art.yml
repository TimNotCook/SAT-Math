name: apply-unit-art

on:
  push:
    paths:
      - '.github/workflows/apply-unit-art.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-unit-art
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch unit art
        run: |
          python3 tools/apply_unit_art.py
          node --check exam.js
          python3 bump_assets.py .
          python3 bump_assets.py .

      - name: Commit patch
        run: |
          git config user.name "sat-art-bot"
          git config user.email "sat-art-bot@users.noreply.github.com"
          git rm .github/workflows/apply-unit-art.yml
          git add -A
          git commit -m "fix(exam): 抽查开场线稿按教材规范重画（弧线居中于顶点、直角方角标）"
          git push origin HEAD:main

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref main
