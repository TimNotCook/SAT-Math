name: hotfix-emptystring
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/hotfix-emptystring.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply empty-string fix
        run: |
          set -e
          echo '' | base64 -d > /tmp/fix.patch
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
      - name: Bump and test
        run: |
          set -e
          python3 bump_assets.py | tail -2
          node --test test/*.test.js | tail -6
      - name: Commit and remove workflow
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix-emptystring.yml
          git add -A
          git commit -m 'fix(score): 空字符串 total/correct 不再被算成 0'
          git push
