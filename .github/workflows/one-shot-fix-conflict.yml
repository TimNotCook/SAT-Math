name: one-shot-fix-conflict
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  fix:
    if: contains(github.event.head_commit.message, 'one-shot-fix2')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fix_conflict_markers.py
      - run: node --check exam.js
      - run: python3 bump_assets.py
      - run: |
          git config user.name "satmath-bot"
          git config user.email "bot@satmath.local"
          git add exam.js index.html exam.html drill.html wrong.html jiangyi.html history.html sw.js version.json
          git commit -m "fix(exam): 清掉误提交的 git 冲突标记，恢复 exam 页脚本；资源版本重刷"
          git push origin HEAD:main
