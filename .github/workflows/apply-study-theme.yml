name: apply-study-theme

on:
  push:
    paths:
      - '.github/workflows/apply-study-theme.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-study-theme
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply theme
        run: |
          python3 tools/apply_study_theme.py
          python3 bump_assets.py .
          python3 bump_assets.py .

      - name: Commit
        run: |
          git config user.name "sat-art-bot"
          git config user.email "sat-art-bot@users.noreply.github.com"
          git rm .github/workflows/apply-study-theme.yml
          git add -A
          git commit -m "style(exam): 抽查开场页换成纸感画布与发丝线页签"
          git push origin HEAD:main

      - name: Trigger Pages deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref main
