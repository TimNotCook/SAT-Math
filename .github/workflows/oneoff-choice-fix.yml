name: oneoff-choice-fix
# 一次性补丁：本机没有 push 凭据，靠 Actions 在仓库里改 data/text.js 与 bluebook.css，
# 跑完测试与自检后提交，并把本 workflow 与补丁脚本一并删掉，仓库不留残留。
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/oneoff-choice-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oneoff-choice-fix
jobs:
  fix:
    if: github.repository == 'TimNotCook/SAT-Math'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 打补丁
        run: python3 tools/oneoff_choice_fix.py
      - name: 重算资源版本
        run: python3 bump_assets.py .
      - name: 自动测试
        run: node --test test/*.test.js
      - name: 静态自检
        run: node tools/verify_assets.mjs
      - name: 提交并自删
        run: |
          set -e
          git config user.name 'satmath-bot'
          git config user.email 'satmath-bot@users.noreply.github.com'
          git rm -q -f .github/workflows/oneoff-choice-fix.yml tools/oneoff_choice_fix.py
          git add -A
          if [ -z "$(git status --porcelain)" ]; then echo 'nothing to commit'; exit 0; fi
          git commit -q -m 'fix(data): SR-099 选项底数按讲义原页回 1.6 系；两行选项不再被压成一行（.drill-choice-text pre-wrap）；TD-12-27 选项按练习册 P26 分两行'
          git push origin HEAD:main
