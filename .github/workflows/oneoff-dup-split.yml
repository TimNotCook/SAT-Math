name: oneoff-dup-split
# 一次性补丁：把"同题干但不同题"的分家清单落成 data/dup-splits.json，并让 dup_groups 读它。
# 跑完测试与自检后提交，并把本 workflow 与补丁脚本一并删掉。
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/oneoff-dup-split.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oneoff-dup-split
jobs:
  fix:
    if: github.repository == 'TimNotCook/SAT-Math'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 打补丁
        run: python3 tools/oneoff_dup_split.py
      - name: 重算 alias 与台账
        run: |
          node tools/dup_groups.mjs --alias
          node tools/dup_groups.mjs --doc > /dev/null
      - name: 重算资源版本
        run: python3 bump_assets.py .
      - name: 自动测试
        run: node --test test/*.test.js
      - name: 静态自检
        run: node tools/verify_assets.mjs
      - name: 提交并自删
        run: |
          set -e
          git config user.name 'satmath-bot'
          git config user.email 'satmath-bot@users.noreply.github.com'
          git rm -q -f .github/workflows/oneoff-dup-split.yml tools/oneoff_dup_split.py
          git add -A
          if [ -z "$(git status --porcelain)" ]; then echo 'nothing to commit'; exit 0; fi
          git commit -q -m 'fix(dup): 重复组里 6 组“同题干但不同题”分家（data/dup-splits.json），alias 165→157、重复组 142→140'
          git push origin HEAD:main
