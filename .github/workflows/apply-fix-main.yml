name: apply-fix-main
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch patch branch
        run: git fetch origin eternal-20261128t-remote2
      - name: Apply fix
        run: |
          git show origin/eternal-20261128t-remote2:fix.patch > /tmp/fix.patch
          git apply --index /tmp/fix.patch
      - name: Remove helper workflow
        run: rm -f .github/workflows/apply-fix-main.yml
      - name: Bump assets
        run: python3 bump_assets.py
      - name: Run tests
        run: npm test
      - name: Commit and push
        run: |
          git config user.name "Doubao Agent"
          git config user.email "agent@satmath.local"
          git add -A
          git commit -m "fix(img-import): 拆多题写盘失败不再被最终提示吞掉"
          git push origin HEAD:main
