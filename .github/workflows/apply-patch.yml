name: apply-patch
on:
  push:
    branches: [ main ]
    paths: [ 'patches/apply.patch' ]
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 应用补丁
        run: git apply --index --3way patches/apply.patch || git apply --index --recount patches/apply.patch
