name: apply-patch
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          P=""
          if [ -f patches/nick.patch ]; then P=patches/nick.patch; elif [ -f patches/apply.patch ]; then P=patches/apply.patch; fi
          echo "$P" > /tmp/patchpath
          if [ -n "$P" ]; then git apply --index "$P"; fi
      - run: python3 bump_assets.py
      - id: test
        continue-on-error: true
        run: |
          node --test test/*.test.js > /tmp/t.log 2>&1
          echo $? > /tmp/rc
      - run: |
          if [ "$(cat /tmp/rc)" != "0" ]; then
            git config user.name "satmath-bot"
            git config user.email "bot@satmath.local"
            git checkout -b ci-log
            { echo "rc=$(cat /tmp/rc)"; sed -n '1,80p' /tmp/t.log; } > ci-log.txt
            git add ci-log.txt
            git commit -m "ci-log: apply-patch 测试未通过"
            git push -f origin ci-log
            exit 1
          fi
      - run: |
          P=$(cat /tmp/patchpath)
          if [ -n "$P" ]; then git rm -q "$P"; fi
          git config user.name "satmath-bot"
          git config user.email "bot@satmath.local"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(apply-patch): 应用补丁并重刷资源版本"
            git push origin HEAD:main
          fi
