name: hotfix3-scratch-pointer
on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/hotfix3-scratch-pointer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply scratch pointer media fix
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scratch-pad.js')
          s = p.read_text(encoding='utf-8')
          a = "@media (hover:none),(pointer:coarse)"
          b = "@media (any-pointer: coarse)"
          assert a in s, 'scratch media pattern missing'
          s = s.replace(a, b, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Bump and test
        run: |
          set -e
          python3 bump_assets.py | tail -2
          node --test test/*.test.js | tail -6
      - name: Commit and remove workflow
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/hotfix3-scratch-pointer.yml
          git add -A
          git commit -m 'fix(scratch): 触屏热区只跟 any-pointer:coarse，桌面鼠标不放大'
          git push
