name: restore-img-import
on:
  push:
    paths:
      - '.github/workflows/restore-img-import.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore full image-import.js from good commit
        run: |
          git config user.name 'TimNotCook'
          git config user.email 'timnotcook@users.noreply.github.com'
          git checkout 1fa733e347676662b6c63a41d94d2343da3f9516 -- image-import.js
          git add image-import.js
          git commit -m 'restore(img-import): 从 1fa733e 还原完整实现（引导脚本误覆盖）'
          git push
