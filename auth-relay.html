<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>auth-relay</title>
</head>
<body>
<!-- 隐藏认证中继：在沙箱 (无 allow-same-origin) 中运行 WorkBuddy SDK。
     沙箱文档的 Origin 为 null，后端按 Origin 校验时放行 null，因此这里的 SDK 请求不会被 GitHub Pages 域名白名单拒绝。
     父页面通过 postMessage RPC 调用，本页不渲染任何 UI。 -->
<script>
'use strict';

/* ---- localStorage 垫片：沙箱内 localStorage 被禁用，改为内存缓存 + 父页面持久化 ---- */
var _store = {};
function persist() {
  try { window.parent.postMessage({ type: 'store', data: _store }, '*'); } catch (e) {}
}
(function installShim() {
  try {
    window.localStorage.getItem('__probe__');
    return; // 原生可用，不覆盖
  } catch (e) { /* 沙箱：需要垫片 */ }
  var shim = {
    getItem: function (k) {
      return Object.prototype.hasOwnProperty.call(_store, k) ? _store[k] : null;
    },
    setItem: function (k, v) { _store[k] = String(v); persist(); },
    removeItem: function (k) { delete _store[k]; persist(); },
    clear: function () { _store = {}; persist(); },
    key: function (i) { return Object.keys(_store)[i] || null; },
    get length() { return Object.keys(_store).length; }
  };
  try {
    Object.defineProperty(window, 'localStorage', { value: shim, configurable: true, writable: true });
  } catch (e) {
    try { window.localStorage = shim; } catch (e2) {}
  }
})();

var cloud = null;
/* sendOtp 拿到的 verification_id 只在发码这一步返回，后续校验必须带上它，
   所以在这里按邮箱缓存一份；顺便记住这个邮箱是不是老用户。 */
var verifyCache = {};
/* resetPasswordForEmail 返回的是一个函数式的 updateUser 句柄，不能跨 postMessage，
   只能在沙箱里留住，等用户填了验证码再调用。 */
var resetHandles = {};

function keyOf(email) { return String(email || '').trim().toLowerCase(); }

function reply(id, ok, data, error, method) {
  try {
    window.parent.postMessage({
      type: 'reply',
      id: id,
      ok: !!ok,
      method: method || '',
      data: data !== undefined ? data : null,
      error: error || null
    }, '*');
  } catch (e) {}
}
function emit(event, session) {
  try { window.parent.postMessage({ type: 'event', event: event, session: session || null }, '*'); } catch (e) {}
}
function errShape(e) {
  if (!e) return null;
  return {
    message: e.message || String(e),
    error_description: e.error_description || '',
    kind: e.kind || '',
    status: e.status || 0,
    code: e.code || ''
  };
}
function okShape(r) {
  if (r && r.error) return { error: errShape(r.error) };
  return { data: r && r.data != null ? r.data : null };
}

window.addEventListener('message', function (ev) {
  var msg = ev.data;
  if (!msg || msg.type !== 'call') return;
  var id = msg.id, method = msg.method, args = msg.args || {};
  (async function () {
    try {
      var res;
      switch (method) {
        case 'init':
          _store = msg.data || {};
          cloud = window.WorkBuddyCloud.createWorkBuddyCloud({
            endpoint: msg.endpoint,
            oauthRelayBaseUrl: msg.oauthRelayBaseUrl,
            publishableKey: msg.publishableKey
          });
          try { cloud.auth.onAuthStateChange(function (event, s) { emit(event, s); }); } catch (e) {}
          reply(id, true, { ready: true }, null, 'init');
          return;
        case 'getSession':
          res = await cloud.auth.getSession(); reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'getSession'); return;
        case 'getUser':
          res = await cloud.auth.getUser(); reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'getUser'); return;
        case 'sendOtp':
          res = await cloud.auth.sendOtp(args);
          if (!res.error && res.data && res.data.verificationId) {
            verifyCache[keyOf(args.email)] = {
              id: res.data.verificationId,
              isUser: !!res.data.isExistingUser
            };
          }
          reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'sendOtp'); return;
        case 'verifyOtp': {
          /* 老用户验证码登录：不发密码，只换会话 */
          var vc = verifyCache[keyOf(args.email)];
          if (!vc || !vc.id) { reply(id, false, null, { message: '请先点「获取验证码」再填码。', code: 'vcode-missing' }, 'verifyOtp'); return; }
          res = await cloud.auth.verifyOtp({
            email: args.email, token: args.token, verificationId: vc.id, isExistingUser: true
          });
          reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'verifyOtp'); return;
        }
        case 'register': {
          /* 新用户：验证码 + 自设密码，注册成功即登录 */
          var rc = verifyCache[keyOf(args.email)];
          if (!rc || !rc.id) { reply(id, false, null, { message: '请先点「获取验证码」再填码。', code: 'vcode-missing' }, 'register'); return; }
          res = await cloud.auth.verifyOtp({
            email: args.email, token: args.token, verificationId: rc.id,
            isExistingUser: false, password: args.password
          });
          reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'register'); return;
        }
        case 'signInPassword':
          res = await cloud.auth.signInWithPassword({ email: args.email, password: args.password });
          reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'signInPassword'); return;
        case 'resetSend':
          res = await cloud.auth.resetPasswordForEmail(args.email);
          if (!res.error && res.data && typeof res.data.updateUser === 'function') {
            resetHandles[keyOf(args.email)] = res.data.updateUser;
            reply(id, true, { sent: true }, null, 'resetSend');
            return;
          }
          reply(id, false, null, errShape(res.error || { message: '重置服务返回异常' }), 'resetSend'); return;
        case 'resetApply': {
          var fn = resetHandles[keyOf(args.email)];
          if (typeof fn !== 'function') { reply(id, false, null, { message: '请先点「获取验证码」再填码。', code: 'vcode-missing' }, 'resetApply'); return; }
          res = await fn({ nonce: args.token, password: args.password });
          if (!res.error) delete resetHandles[keyOf(args.email)];
          reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'resetApply'); return;
        }
        case 'signOut':
          await cloud.auth.signOut(); reply(id, true, {}, null, 'signOut'); return;
        case 'signInWithOAuth':
          res = await cloud.auth.signInWithOAuth(args); reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'signInWithOAuth'); return;
        case 'handleOAuthCallback':
          res = await cloud.auth.handleOAuthCallback(); reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'handleOAuthCallback'); return;
        case 'handleWechatWebCallback':
          res = await cloud.auth.handleWechatWebCallback(); reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'handleWechatWebCallback'); return;
        case 'handleWorkBuddyCallback':
          res = await cloud.auth.handleWorkBuddyCallback(); reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'handleWorkBuddyCallback'); return;
        case 'db':
          res = await dbCall(args); reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'db'); return;
        case 'storage':
          res = await storageCall(args); reply(id, !res.error, okShape(res), res.error ? errShape(res.error) : null, 'storage'); return;
        default:
          reply(id, false, null, { message: 'unknown method: ' + method }, method); return;
      }
    } catch (e) {
      reply(id, false, null, errShape(e), method);
    }
  })();
});

async function dbCall(a) {
  var q = cloud.database.from(a.table);
  if (a.op === 'select') {
    q = q.select('id,payload,updated_at').maybeSingle();
  } else if (a.op === 'update') {
    q = q.update(a.payload).eq('id', a.eq).select();
  } else if (a.op === 'insert') {
    q = q.insert(a.payload).select();
  } else return { error: { message: 'unknown db op: ' + a.op } };
  return q;
}

/* 文件存储探测/读写：只允许 tdsync 前缀的桶，避免被当成通用网盘滥用。
   用途：判断后端有没有开 storage 通道（database 被 403 挡住时的备选承载）。 */
async function storageCall(a) {
  var bucket = String(a.bucket || '');
  /* 本应用只开通了 runtime 一个桶；tdsync 前缀留给后续自建桶，其余一律拒绝 */
  if (bucket && !/^(runtime|tdsync)/.test(bucket)) return { error: { message: 'bucket 未授权：' + bucket } };
  var storage = cloud.storage;
  if (a.op === 'buckets') return await storage.listBuckets();
  if (a.op === 'upload') {
    var blob = new Blob([String(a.text == null ? '' : a.text)], { type: 'application/json' });
    return await storage.from(bucket).upload(String(a.path || ''), blob, { upsert: true, contentType: 'application/json' });
  }
  if (a.op === 'download') {
    var got = await storage.from(bucket).download(String(a.path || ''));
    if (!got.error && got.data && typeof got.data.text === 'function') got.data = await got.data.text();
    return got;
  }
  if (a.op === 'remove') return await storage.from(bucket).remove([String(a.path || '')]);
  return { error: { message: 'unknown storage op: ' + a.op } };
}

/* 优先加载本地 SDK（国内零外部依赖），失败时再依次回退到 unpkg 与 jsDelivr */
var SDK_URLS = [
  'vendor/cloud/workbuddy-cloud-sdk.js',
  'https://unpkg.com/@tencent-ai/workbuddy-cloud-sdk@0.1.4/lib/index.global.js',
  'https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@0.1.4/lib/index.global.js'
];
var _sdkIdx = 0;

function bootSdk() {
  if (window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud) {
    try { window.parent.postMessage({ type: 'sdk-ready' }, '*'); } catch (e) {}
    return;
  }
  if (_sdkIdx >= SDK_URLS.length) {
    try {
      window.parent.postMessage({
        type: 'sdk-error',
        error: { message: 'WorkBuddy SDK 加载失败，请检查网络连接' }
      }, '*');
    } catch (e) {}
    reply(0, false, null, { message: 'sdk load failed' }, 'boot');
    return;
  }
  var s = document.createElement('script');
  s.src = SDK_URLS[_sdkIdx++];
  s.onload = function () {
    if (window.WorkBuddyCloud && window.WorkBuddyCloud.createWorkBuddyCloud) {
      try { window.parent.postMessage({ type: 'sdk-ready' }, '*'); } catch (e) {}
    } else {
      bootSdk();
    }
  };
  s.onerror = bootSdk;
  document.head.appendChild(s);
}
bootSdk();
</script>
</body>
</html>
