<style>
/* 图片识别导入：复用站点既有 token（与 pdfimp 同一套变量） */
.imgimp-panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius-lg);padding:var(--sp4);margin-bottom:var(--sp3);box-shadow:var(--shadow-1)}
.imgimp-panel[hidden]{display:none}
.imgimp-head{display:flex;gap:var(--sp3);align-items:flex-start;justify-content:space-between;margin-bottom:var(--sp3)}
.imgimp-head h2{margin:0 0 6px;font-size:17px;letter-spacing:-.01em;color:var(--ink)}
.imgimp-head p{margin:0;max-width:76ch;color:var(--sub);font-size:13px;line-height:1.7}
.imgimp-x{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--line);background:var(--paper);color:var(--sub);border-radius:var(--radius-sm);cursor:pointer;transition:background-color .15s var(--ease),color .15s var(--ease)}
.imgimp-x:hover{background:var(--wash);color:var(--ink)}
.imgimp-note{display:block;margin-top:8px;font-size:12px;color:var(--sub)}
.imgimp-drop{display:flex;align-items:center;justify-content:center;gap:10px;padding:22px;margin-bottom:var(--sp2);border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--wash);color:var(--sub);font-size:13.5px;cursor:pointer;transition:border-color .15s var(--ease),background-color .15s var(--ease),color .15s var(--ease)}
.imgimp-drop:hover,.imgimp-drop.is-dragover{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-strong)}
.imgimp-drop:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.imgimp-finder-bar{display:flex;gap:var(--sp1);align-items:center;margin:var(--sp2) 0 var(--sp1)}
.imgimp-finder-bar input{flex:1 1 auto;min-width:0;min-height:38px;padding:6px 11px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font:13.5px/1.5 var(--sans)}
.imgimp-finder-bar input:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.imgimp-finder-bar .btn{flex:0 0 auto;min-height:38px}
.imgimp-finder-hint{padding:6px 0;color:var(--sub);font-size:12.5px}
.imgimp-finder-list{display:flex;flex-direction:column;gap:6px;padding:var(--sp1) 0 var(--sp2)}
.imgimp-picks{display:flex;flex-direction:column;gap:6px;margin-top:var(--sp1);padding-top:var(--sp1);border-top:1px dashed var(--line-soft);font-size:12.5px;line-height:1.6;color:var(--sub)}
.imgimp-cand{display:block;width:100%;text-align:left;padding:7px 10px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font:13px/1.45 var(--sans);cursor:pointer;transition:background-color .12s var(--ease),border-color .12s var(--ease)}
.imgimp-cand:hover{background:var(--blue-soft);border-color:var(--blue)}
.imgimp-cand small{display:block;margin-top:2px;color:var(--sub);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgimp-actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp1);margin-bottom:var(--sp2)}
.imgimp-actions select{min-height:36px;padding:5px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font:13px var(--sans)}
.imgimp-progress{height:4px;background:var(--line-soft);border-radius:var(--radius-pill);overflow:hidden}
.imgimp-progress>i{display:block;height:100%;width:0;background:var(--blue);transition:width .15s var(--ease)}
.imgimp-status{margin:var(--sp2) 0;color:var(--sub);min-height:1.4em}
/* 云端登录按钮默认隐藏：.btn 自带 display，需显式覆盖 UA 的 [hidden] */
.btn[hidden]{display:none}
.imgimp-login-state.is-ok{color:var(--ok)}
.imgimp-rows{display:flex;flex-direction:column;gap:var(--sp2)}
.imgimp-row{display:grid;grid-template-columns:110px minmax(0,1fr);gap:var(--sp3);padding:var(--sp2);border:1px solid var(--line);border-radius:var(--radius);background:var(--paper)}
.imgimp-thumb img{display:block;width:110px;max-height:150px;object-fit:contain;border:1px solid var(--line-soft);border-radius:var(--radius-sm);background:var(--wash)}
.imgimp-thumb-ph{display:flex;align-items:center;justify-content:center;width:110px;height:90px;border:1px dashed var(--line-strong);border-radius:var(--radius-sm);color:var(--faint);font-size:12px;background:var(--wash)}
.imgimp-fields{min-width:0}
.imgimp-line{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp1);margin-bottom:var(--sp1);color:var(--ink);font-size:13.5px}
.imgimp-badge{font-size:11.5px;padding:2px 8px;border-radius:var(--radius-pill);border:1px solid var(--line);background:var(--wash);color:var(--sub)}
.imgimp-badge.ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-soft)}
.imgimp-badge.warn{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.imgimp-ocr{padding:8px 10px;margin-bottom:var(--sp1);border-radius:var(--radius-sm);background:var(--wash);color:var(--ink);font-size:13px;line-height:1.6;max-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.imgimp-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp2);align-items:end;margin-bottom:var(--sp1)}
.imgimp-grid label{display:flex;flex-direction:column;gap:4px;color:var(--sub);font-size:12.5px;min-width:0}
.imgimp-grid select{width:100%;min-height:38px;padding:6px 9px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--paper);color:var(--ink);font:13px/1.4 var(--sans)}
.imgimp-grid select:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
.imgimp-check{display:inline-flex;align-items:center;gap:6px;min-height:36px;color:var(--ink);font-size:13px;cursor:pointer}
.imgimp-check input{width:16px;height:16px;accent-color:var(--blue)}
.imgimp-empty{padding:var(--sp4);text-align:center;color:var(--sub);font-size:13px;border:1px dashed var(--line-strong);border-radius:var(--radius)}
.imgimp-matched{margin-top:2px;color:var(--sub);font-size:12.5px}
.imgimp-matched b{color:var(--blue-strong,#1d4ed8)}
.imgimp-review{margin-top:6px;color:var(--sub);font-size:12.5px;line-height:1.7}
@media(max-width:860px){.imgimp-row{grid-template-columns:64px minmax(0,1fr)}.imgimp-thumb img{width:64px;max-height:96px}}

<script>
/* 自动换新：标签页开久了会一直跑旧代码（贴图认不出、等半天，其实改的早推上去了）。
   每 60 秒（以及切回标签页时）问一次 version.json，发现构建号不同就静默刷新一次。 */
(function () {
  var src = (document.querySelector('script[src*="image-import.js"]') || {}).src || '';
  var m = src.match(/v=([0-9a-f]{6,})/);
  var mine = m ? m[1] : '';
  var key = 'satmath-rel-' + mine, tries = +(sessionStorage.getItem(key) || 0);
  function check() {
    if (tries >= 3) return;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j || !j.v || j.v === mine) return;
        var busy = window.TD_IMG_IMPORT && window.TD_IMG_IMPORT.isBusy && window.TD_IMG_IMPORT.isBusy();
        if (busy) { setTimeout(check, 4000); return; }
        sessionStorage.setItem(key, String(tries + 1));
        location.replace(location.pathname + '?v=' + j.v + (location.hash || ''));
      }).catch(function () {});
  }
  setTimeout(check, 2500);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  setInterval(check, 60000);
})();
/* 网络抽风时 image-import.js 可能整块没下来（页面上按钮在、点了没反应）。
   这种情况必须自己说出来，不然人只会以为功能坏了。 */
setTimeout(function () {
  if (window.TD_IMG_IMPORT) return;
  var d = document.getElementById('imgimpDiag');
  if (d) d.textContent = '导入脚本没加载成功（网络原因，不是功能坏了）：刷新一次页面即可。';
}, 8000);
</script></body></html>
